name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf lotus-project
          unzip -o NilaAI_Android_Project.zip -d lotus-project

      - name: Fix JVM target
        working-directory: lotus-project/PersonalVideoAI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          marker = """    defaultConfig {
"""

          insert = """    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

"""

          if "sourceCompatibility JavaVersion.VERSION_17" not in text:
              text = text.replace(marker, insert + marker)

          p.write_text(text)
          PY

          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lotus-project/PersonalVideoAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: lotus-project/PersonalVideoAI/app/build/outputs/apk/debug/app-debug.apk
