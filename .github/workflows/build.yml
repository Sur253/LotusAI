name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf lotus-project
          unzip -o LotusAI-Step3-Gemini.zip -d lotus-project
      - name: Fix text colors
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/setTextColor(text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
          sed -i 's/setTextColor(this@MainActivity.text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
      - name: Add Lotus voice reply and UI fix
        working-directory: lotus-project/PersonalVideoAI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/personalvideoai/MainActivity.kt")
          s = p.read_text()

          s = s.replace(
              "import android.speech.RecognizerIntent",
              "import android.speech.RecognizerIntent\nimport android.speech.tts.TextToSpeech\nimport java.util.Locale"
          )

          s = s.replace(
              "private val executor = Executors.newSingleThreadExecutor()",
              "private val executor = Executors.newSingleThreadExecutor()\nprivate var tts: TextToSpeech? = null"
          )

          s = s.replace(
              "buildUi()\n\n}",
              """tts = TextToSpeech(this) { status ->
              if (status == TextToSpeech.SUCCESS) {
                  tts?.language = Locale("ta", "IN")
              }
          }

          buildUi()

          }"""
          )

          s = s.replace(
              "gravity = Gravity.CENTER",
              "gravity = Gravity.TOP or Gravity.START"
          )

          s = s.replace(
              "LinearLayout.LayoutParams(-1, 180)",
              "LinearLayout.LayoutParams(-1, 320)"
          )

          s = s.replace(
              'runOnUiThread { chat.text = "Lotus:\\n\\n$answer"; input.text.clear(); input.isEnabled = true }',
              """runOnUiThread {
                  chat.text = "Lotus:\\n\\n$answer"
                  input.text.clear()
                  input.isEnabled = true
                  tts?.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "lotus_reply")
              }"""
          )

          s = s.replace(
              "override fun onActivityResult(",
              """override fun onDestroy() {
              tts?.stop()
              tts?.shutdown()
              executor.shutdownNow()
              super.onDestroy()
          }

          override fun onActivityResult("""
          )

          p.write_text(s)
          PY

          echo "===== Lotus voice + UI fix applied ====="
          grep -n "TextToSpeech\|lotus_reply\|LayoutParams(-1, 320)" app/src/main/java/com/personalvideoai/MainActivity.kt || true
      - name: Check Gemini source
        working-directory: lotus-project/PersonalVideoAI  
        run: |
          echo "===== GeminiClient.kt ====="
          sed -n '1,240p' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== MainActivity Gemini calls ====="
          grep -n "GeminiClient\|sendToAi\|api_key" app/src/main/java/com/personalvideoai/MainActivity.kt || true
      - name: Fix Gemini timeout
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/TimeUnit.SECONDS/TimeUnit.SECONDS/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/readTimeout(180, TimeUnit.SECONDS)/readTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/writeTimeout(180, TimeUnit.SECONDS)/writeTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/connectTimeout(30, TimeUnit.SECONDS)/connectTimeout(15, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== Gemini timeout fixed ====="
          grep -n "Timeout" app/src/main/java/com/personalvideoai/GeminiClient.kt
      - name: Fix JVM target
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }\
          ' app/build.gradle

          sed -i '/android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }\
          ' app/build.gradle

          echo "===== build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lotus-project/PersonalVideoAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: lotus-project/PersonalVideoAI/app/build/outputs/apk/debug/app-debug.apk
