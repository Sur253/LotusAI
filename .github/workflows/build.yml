name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
     - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf lotus-project
          unzip -o LotusAI-Step3-Gemini.zip -d lotus-project
      - name: Copy MainActivity
        run: |
          cp MainActivity.kt lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt 
    
      - name: Add Lotus Background Image
        working-directory: lotus-project/PersonalVideoAI
        run: |
          mkdir -p app/src/main/res/drawable
          cp "$GITHUB_WORKSPACE/lotus_background.png" app/src/main/res/drawable/lotus_background.png
          echo "Lotus background image added successfully"
      - name: Check MainActivity TTS
        run: |
          echo "===== MainActivity TTS declarations ====="
          grep -n "var tts" lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt || true
          echo "===== MainActivity lines 265-290 ====="
          sed -n '265,290p' lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt  
      - name: Verify MainActivity UI
        run: |
          grep -n "Lotus-விடம் கேளுங்கள்" lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt
          grep -n 'val mic = pill' lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt
          grep -n 'val send = pill' lotus-project/PersonalVideoAI/app/src/main/java/com/personalvideoai/MainActivity.kt
      - name: Fix text colors
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/setTextColor(text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
          sed -i 's/setTextColor(this@MainActivity.text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
      - name: Lotus final UI layout
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/MainActivity.kt"

          sed -i 's/window.statusBarColor = .*/window.statusBarColor = bg/' "$FILE"
          sed -i 's/window.navigationBarColor = .*/window.navigationBarColor = bg/' "$FILE"

          sed -i 's/LinearLayout.LayoutParams(-1, 320)/LinearLayout.LayoutParams(-1, 0).apply { weight = 1f }/' "$FILE"

          sed -i 's/🎙️ பேச/🎙️ Ask Lotus/' "$FILE"
          sed -i 's/text = "SEND ➜"/text = "🎙️ Ask Lotus"/' "$FILE"

          echo "===== Lotus final UI layout applied ====="
          grep -n "Ask Lotus\|weight = 1f\|statusBarColor" "$FILE" || true  
      - name: Check Gemini source
        working-directory: lotus-project/PersonalVideoAI  
        run: |
          echo "===== GeminiClient.kt ====="
          sed -n '1,240p' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== MainActivity Gemini calls ====="
          grep -n "GeminiClient\|sendToAi\|api_key" app/src/main/java/com/personalvideoai/MainActivity.kt || true
      - name: Fix Gemini timeout
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/TimeUnit.SECONDS/TimeUnit.SECONDS/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/readTimeout(180, TimeUnit.SECONDS)/readTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/writeTimeout(180, TimeUnit.SECONDS)/writeTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/connectTimeout(30, TimeUnit.SECONDS)/connectTimeout(15, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== Gemini timeout fixed ====="
          grep -n "Timeout" app/src/main/java/com/personalvideoai/GeminiClient.kt
      - name: Fix Gemini connection
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/GeminiClient.kt"

          sed -i 's/\.connectTimeout(30, TimeUnit.SECONDS)/.connectTimeout(60, TimeUnit.SECONDS)/' "$FILE"
          sed -i 's/\.readTimeout(180, TimeUnit.SECONDS)/.readTimeout(120, TimeUnit.SECONDS)/' "$FILE"
          sed -i 's/\.writeTimeout(180, TimeUnit.SECONDS)/.writeTimeout(120, TimeUnit.SECONDS)/' "$FILE"
          sed -i 's/private val model = ".*"/private val model = "gemini-3.8-flash"/' "$FILE"

          echo "===== Gemini connection fixed ====="
          grep -n "connectTimeout\|readTimeout\|writeTimeout\|private val model" "$FILE"   
      - name: Add Gemini automatic retry
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/GeminiClient.kt"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/personalvideoai/GeminiClient.kt")
          s = p.read_text()

          marker = 'private val client = OkHttpClient.Builder()'
          old = '''private val client = OkHttpClient.Builder()
          '''

          if 'Add Gemini automatic retry' in s:
              print("Retry already present")
              raise SystemExit(0)

          interceptor = '''private val client = OkHttpClient.Builder()
              .addInterceptor { chain ->
                  var lastResponse: okhttp3.Response? = null
                  for (attempt in 0..2) {
                      lastResponse?.close()
                      val response = chain.proceed(chain.request())

                      if (response.isSuccessful ||
                          response.code != 429 &&
                          response.code !in 500..599) {
                          return@addInterceptor response
                      }

                      lastResponse = response

                      if (attempt < 2) {
                          Thread.sleep((attempt + 1) * 2000L)
                      }
                  }
                  return@addInterceptor lastResponse!!
              }
          '''

          if marker not in s:
              raise SystemExit("GeminiClient builder not found")

          s = s.replace(old, interceptor, 1)
          p.write_text(s)
          PY

          echo "===== Gemini automatic retry added ====="
          grep -n "addInterceptor\|attempt in 0..2\|Thread.sleep" "$FILE"
      - name: Use stable fallback Gemini model
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/GeminiClient.kt"
          sed -i 's/private val model = "gemini-3.8-flash"/private val model = "gemini-3.6-flash"/' "$FILE"
          echo "===== Gemini fallback model ====="
          grep -n "private val model" "$FILE"  
      - name: Final UI verification
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/MainActivity.kt"
          echo "===== FINAL UI CHECK ====="
          grep -n "Lotus-விடம் கேளுங்கள்" "$FILE"
          grep -n 'val mic = pill' "$FILE"
          grep -n 'val send = pill' "$FILE"
      - name: Fix JVM target
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }\
          ' app/build.gradle

          sed -i '/android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }\
          ' app/build.gradle

          echo "===== build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lotus-project/PersonalVideoAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: lotus-project/PersonalVideoAI/app/build/outputs/apk/debug/app-debug.apk
