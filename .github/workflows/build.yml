name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf lotus-project
          unzip -o LotusAI-Step3-Gemini.zip -d lotus-project
      - name: Fix text colors
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/setTextColor(this@MainActivity.text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
      - name: Fix JVM target
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }\
          ' app/build.gradle

          sed -i '/android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }\
          ' app/build.gradle

          echo "===== build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lotus-project/PersonalVideoAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: lotus-project/PersonalVideoAI/app/build/outputs/apk/debug/app-debug.apk
