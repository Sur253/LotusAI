name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir lotus-project
          unzip -o NilaAI_Android_Project.zip -d lotus-project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find lotus-project -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find lotus-project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
