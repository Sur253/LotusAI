name: Build Lotus AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf lotus-project
          unzip -o LotusAI-Step3-Gemini.zip -d lotus-project
      - name: Fix text colors
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/setTextColor(text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
          sed -i 's/setTextColor(this@MainActivity.text)/setTextColor(android.graphics.Color.WHITE)/g' app/src/main/java/com/personalvideoai/MainActivity.kt
      - name: Lotus UI and voice setup
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/MainActivity.kt"

          sed -i 's/START_VERTICAL/VERTICAL/g' "$FILE"

          sed -i '/import android.speech.RecognizerIntent/a import android.speech.tts.TextToSpeech' "$FILE"
          sed -i '/import android.speech.tts.TextToSpeech/a import java.util.Locale' "$FILE"

          sed -i '/private val executor = Executors.newSingleThreadExecutor()/a private var tts: TextToSpeech? = null' "$FILE"

          sed -i 's/LinearLayout.LayoutParams(-1, 180)/LinearLayout.LayoutParams(-1, 320)/' "$FILE"

          sed -i '/^[[:space:]]*buildUi()/i\
          tts = TextToSpeech(this) { status ->\
              if (status == TextToSpeech.SUCCESS) {\
                  tts?.language = Locale("ta", "IN")\
              }\
          }' "$FILE"

          echo "===== Lotus UI and voice setup applied ====="
          grep -n "TextToSpeech\|Locale\|320" "$FILE" || true 
      - name: Lotus final UI layout
        working-directory: lotus-project/PersonalVideoAI
        run: |
          FILE="app/src/main/java/com/personalvideoai/MainActivity.kt"

          sed -i 's/window.statusBarColor = .*/window.statusBarColor = bg/' "$FILE"
          sed -i 's/window.navigationBarColor = .*/window.navigationBarColor = bg/' "$FILE"

          sed -i 's/LinearLayout.LayoutParams(-1, 320)/LinearLayout.LayoutParams(-1, 0).apply { weight = 1f }/' "$FILE"

          sed -i 's/🎙️ பேச/🎙️ Ask Lotus/' "$FILE"
          sed -i 's/text = "SEND ➜"/text = "🎙️ Ask Lotus"/' "$FILE"

          echo "===== Lotus final UI layout applied ====="
          grep -n "Ask Lotus\|weight = 1f\|statusBarColor" "$FILE" || true  
      - name: Check Gemini source
        working-directory: lotus-project/PersonalVideoAI  
        run: |
          echo "===== GeminiClient.kt ====="
          sed -n '1,240p' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== MainActivity Gemini calls ====="
          grep -n "GeminiClient\|sendToAi\|api_key" app/src/main/java/com/personalvideoai/MainActivity.kt || true
      - name: Fix Gemini timeout
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i 's/TimeUnit.SECONDS/TimeUnit.SECONDS/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/readTimeout(180, TimeUnit.SECONDS)/readTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/writeTimeout(180, TimeUnit.SECONDS)/writeTimeout(30, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          sed -i 's/connectTimeout(30, TimeUnit.SECONDS)/connectTimeout(15, TimeUnit.SECONDS)/g' app/src/main/java/com/personalvideoai/GeminiClient.kt
          echo "===== Gemini timeout fixed ====="
          grep -n "Timeout" app/src/main/java/com/personalvideoai/GeminiClient.kt
      - name: Fix JVM target
        working-directory: lotus-project/PersonalVideoAI
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }\
          ' app/build.gradle

          sed -i '/android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }\
          ' app/build.gradle

          echo "===== build.gradle ====="
          cat app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: lotus-project/PersonalVideoAI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-AI-APK
          path: lotus-project/PersonalVideoAI/app/build/outputs/apk/debug/app-debug.apk
